name: Discord — Bug Reports

on:
  issues:
    types: [opened, closed, reopened, labeled]

jobs:
  notify:
    environment: 'bb-huge🤗 .env'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect 'bug' label on issue
        id: detect
        run: |
          python - <<'PY'
import json, os
e = json.load(open(os.environ['GITHUB_EVENT_PATH']))
labels = [l.get('name','') for l in e.get('issue',{}).get('labels',[])]
print('true' if 'bug' in labels else 'false')
PY
          echo "is_bug=$(python - <<'PY'
import json, os
e = json.load(open(os.environ['GITHUB_EVENT_PATH']))
labels = [l.get('name','') for l in e.get('issue',{}).get('labels',[])]
print('true' if 'bug' in labels else 'false')
PY
)" >> $GITHUB_OUTPUT

      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/assets/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        if: steps.detect.outputs.is_bug == 'true'
        run: python -m pip install --upgrade pip && python -m pip install -r .github/assets/requirements.txt

      - name: Debug event & secret
        if: steps.detect.outputs.is_bug == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_BUG_REPORTS_WEBHOOK }}
        run: |
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          if [ -f "$GITHUB_EVENT_PATH" ]; then
            echo "Event file size: $(wc -c < \"$GITHUB_EVENT_PATH\")"
            head -c 400 "$GITHUB_EVENT_PATH" | sed -n '1,40p'
          else
            echo "Event file missing: $GITHUB_EVENT_PATH"
          fi
          if [ -n "$DISCORD_WEBHOOK" ]; then echo "DISCORD_WEBHOOK present"; else echo "DISCORD_WEBHOOK MISSING"; fi

      - name: Post to #bug-reports
        if: steps.detect.outputs.is_bug == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_BUG_REPORTS_WEBHOOK }}
        run: |
          python .github/assets/discord_webhook_notify.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-type bug \
            --webhook "${{ secrets.DISCORD_BUG_REPORTS_WEBHOOK }}"
