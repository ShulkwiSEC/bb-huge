name: Discord — Bug Reports (opened)

on:
  issues:
    types: [opened]

jobs:
  notify:
    environment: 'bb-huge🤗 .env'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect 'bug' label on opened issue
        id: detect
        run: |
          python - <<'PY'
import json, os
e = json.load(open(os.environ['GITHUB_EVENT_PATH']))
labels = [l.get('name','') for l in e.get('issue',{}).get('labels',[])]
print('true' if 'bug' in labels else 'false')
PY
          echo "is_bug=$(python - <<'PY'
import json, os
e = json.load(open(os.environ['GITHUB_EVENT_PATH']))
labels = [l.get('name','') for l in e.get('issue',{}).get('labels',[])]
print('true' if 'bug' in labels else 'false')
PY
)" >> $GITHUB_OUTPUT

      - name: Install Python dependencies
        if: steps.detect.outputs.is_bug == 'true'
        run: python -m pip install --upgrade pip && python -m pip install -r .github/assets/requirements.txt

      - name: Post to #bug-reports
        if: steps.detect.outputs.is_bug == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_BUG_REPORTS_WEBHOOK }}
        run: |
          python .github/assets/discord_webhook_notify.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-type bug \
            --webhook "${{ secrets.DISCORD_BUG_REPORTS_WEBHOOK }}"
