name: Discord — Bug Reports

on:
  issues:
    types: [opened, closed, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'bug')
    steps:
      - name: Post to #bug-reports
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_BUG_REPORTS_WEBHOOK }}
        run: |
          ACTION="${{ github.event.action }}"
          case "$ACTION" in
            opened)   COLOR=15158332  ;; # red
            closed)   COLOR=5763719   ;; # green
            reopened) COLOR=16776960  ;; # yellow
            *)        COLOR=10197915  ;; # gray
          esac

          TITLE=$(echo '${{ github.event.issue.title }}' | head -c 256)
          BODY=$(echo '${{ github.event.issue.body }}' | head -c 1024)
          URL="${{ github.event.issue.html_url }}"
          USER="${{ github.event.issue.user.login }}"
          NUMBER="${{ github.event.issue.number }}"

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🐛 [#${NUMBER}] ${TITLE}\",
                \"description\": \"${BODY}\",
                \"url\": \"${URL}\",
                \"color\": ${COLOR},
                \"fields\": [
                  {\"name\": \"Status\",  \"value\": \"${ACTION}\",  \"inline\": true},
                  {\"name\": \"Opened by\", \"value\": \"${USER}\", \"inline\": true}
                ],
                \"footer\": {\"text\": \"bb-huge / bug-report\"}
              }]
            }"
