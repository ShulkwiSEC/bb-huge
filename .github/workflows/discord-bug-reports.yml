name: Discord — Bug Reports

on:
  issues:
    types: [opened, labeled, reopened]

jobs:
  notify:
    environment: 'bb-huge🤗 .env'
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'bug') ||
      (github.event.action != 'labeled' && contains(github.event.issue.labels.*.name, 'bug'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/assets/requirements.txt

      - name: Post to #bug-reports
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_BUG_REPORTS_WEBHOOK }}
        run: |
          python .github/assets/discord_webhook_notify.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-type bug \
            --webhook "${{ secrets.DISCORD_BUG_REPORTS_WEBHOOK }}"
