name: Discord — Releases

on:
  release:
    types: [published]

jobs:
  notify:
    environment: 'bb-huge🤗 .env'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/assets/requirements.txt

      - name: Post to #releases
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: |
          python .github/assets/discord_webhook_notify.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-type release \
            --webhook "${{ secrets.DISCORD_RELEASES_WEBHOOK }}"
