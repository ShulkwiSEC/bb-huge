name: Discord — Releases

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to #releases
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK is not configured"
            exit 1
          fi

          TAG="${{ github.event.release.tag_name }}"
          NAME=$(cat <<'EOF'
          ${{ github.event.release.name }}
          EOF
          )
          BODY=$(cat <<'EOF'
          ${{ github.event.release.body }}
          EOF
          )
          BODY=$(printf '%s' "$BODY" | head -c 1500)
          URL="${{ github.event.release.html_url }}"
          AUTHOR="${{ github.event.release.author.login }}"
          PRERELEASE="${{ github.event.release.prerelease }}"

          if [ "$PRERELEASE" = "true" ]; then
            LABEL="Pre-release"
            COLOR=16776960
          else
            LABEL="Release"
            COLOR=1752220
          fi

          PAYLOAD=$(jq -n \
            --arg content "@everyone 🚀 **bb-huge ${TAG}** is out!" \
            --arg title "🚀 ${NAME} (${TAG})" \
            --arg description "$BODY" \
            --arg url "$URL" \
            --arg label "$LABEL" \
            --arg author "$AUTHOR" \
            --argjson color "${COLOR}" \
            '{content:$content,embeds:[{title:$title,description:$description,url:$url,color:$color,fields:[{name:"Type",value:$label,inline:true},{name:"Released by",value:$author,inline:true}],footer:{text:"bb-huge / releases"}}]}'
          )

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
