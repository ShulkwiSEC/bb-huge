name: Discord — Commits

on:
  push:
    branches:
      - main  # Or your default branch

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post Commits to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_COMMITS_WEBHOOK }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK is not configured"
            exit 1
          fi

          COMMITS_JSON=$(cat <<'EOF'
          ${{ toJson(github.event.commits) }}
          EOF
          )

          echo "$COMMITS_JSON" | jq -c '.[]' | while read -r commit; do
            MSG=$(jq -r '.message' <<<"$commit")
            SUBJECT=$(printf '%s' "$MSG" | head -n 1 | cut -c 1-256)
            DESC=$(printf '%s' "$MSG" | sed '1d' | cut -c 1-1024)

            if [ -z "$DESC" ]; then
              DESC="No additional details provided."
            fi

            URL=$(jq -r '.url' <<<"$commit")
            AUTHOR=$(jq -r '.author.username // .author.name // .author.email // "unknown"' <<<"$commit")
            SHA=$(jq -r '.id | .[0:7]' <<<"$commit")
            HASH="\`$SHA\`"

            PAYLOAD=$(jq -n \
              --arg title "🔨 Commit: $SUBJECT" \
              --arg description "$DESC" \
              --arg url "$URL" \
              --arg author "$AUTHOR" \
              --arg hash "$HASH" \
              --argjson color 3447003 \
              '{embeds:[{title:$title,description:$description,url:$url,color:$color,fields:[{name:"Author",value:$author,inline:true},{name:"Hash",value:$hash,inline:true}],footer:{text:"bb-huge / source-code"}}]}'
            )

            curl -s -X POST "$DISCORD_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
          done