name: Discord — Commits

on:
  push:
    branches:
      - main  # Or your default branch

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post Commits to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_COMMITS_WEBHOOK }}
        run: |
          # Use jq to parse the JSON payload from GitHub safely
          # This loops through every commit in the push event
          echo '${{ toJson(github.event.commits) }}' | jq -c '.[]' | while read -r commit; do
            
            MSG=$(echo "$commit" | jq -r '.message')
            # Extract subject (first line) and body
            SUBJECT=$(echo "$MSG" | head -n 1 | cut -c 1-256)
            DESC=$(echo "$MSG" | sed '1d' | cut -c 1-1024)
            
            # If the body is empty, provide a small placeholder
            if [ -z "$DESC" ]; then DESC="No additional details provided."; fi

            URL=$(echo "$commit" | jq -r '.url')
            AUTHOR=$(echo "$commit" | jq -r '.author.username // .author.name')
            SHA=$(echo "$commit" | jq -r '.id | .[0:7]')

            curl -s -X POST "$DISCORD_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "{
                \"embeds\": [{
                  \"title\": \"🔨 Commit: ${SUBJECT}\",
                  \"description\": \"${DESC}\",
                  \"url\": \"${URL}\",
                  \"color\": 3447003,
                  \"fields\": [
                    {\"name\": \"Author\", \"value\": \"${AUTHOR}\", \"inline\": true},
                    {\"name\": \"Hash\", \"value\": \"\`${SHA}\`\", \"inline\": true}
                  ],
                  \"footer\": {\"text\": \"bb-huge / source-code\"}
                }]
              }"
          done