name: Discord — Feature Requests

on:
  issues:
    types: [opened, closed, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'enhancement')
    steps:
      - name: Post to #feature-requests
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_FEATURE_REQUESTS_WEBHOOK }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK is not configured"
            exit 1
          fi

          ACTION="${{ github.event.action }}"
          case "$ACTION" in
            opened)   COLOR=7419530   ;; # purple
            closed)   COLOR=5763719   ;; # green
            reopened) COLOR=16776960  ;; # yellow
            *)        COLOR=10197915  ;; # gray
          esac

          TITLE=$(cat <<'EOF'
          ${{ github.event.issue.title }}
          EOF
          )
          TITLE=$(printf '%s' "$TITLE" | head -c 256)

          BODY=$(cat <<'EOF'
          ${{ github.event.issue.body }}
          EOF
          )
          BODY=$(printf '%s' "$BODY" | head -c 1024)

          URL="${{ github.event.issue.html_url }}"
          USER="${{ github.event.issue.user.login }}"
          NUMBER="${{ github.event.issue.number }}"

          PAYLOAD=$(jq -n \
            --arg title "💡 [#${NUMBER}] $TITLE" \
            --arg description "$BODY" \
            --arg url "$URL" \
            --arg action "$ACTION" \
            --arg user "$USER" \
            --argjson color "${COLOR}" \
            '{embeds:[{title:$title,description:$description,url:$url,color:$color,fields:[{name:"Status",value:$action,inline:true},{name:"Opened by",value:$user,inline:true}],footer:{text:"bb-huge / feature-request"}}]}'
          )

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
