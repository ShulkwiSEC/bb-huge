name: Discord — Feature Requests

on:
  issues:
    types: [opened, labeled]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect 'enhancement' label
        id: detect
        run: |
          python - <<'PY'
import json, os, sys
path = os.environ.get('GITHUB_EVENT_PATH')
if not path:
    print('false')
    sys.exit(0)
e = json.load(open(path))
action = e.get('action')
if action == 'labeled' and e.get('label', {}).get('name') == 'enhancement':
    print('true')
else:
    labels = [l.get('name','') for l in e.get('issue', {}).get('labels', [])]
    print('true' if 'enhancement' in labels else 'false')
PY
          echo "is_enhancement=$(python - <<'PY'
import json, os, sys
path = os.environ.get('GITHUB_EVENT_PATH')
if not path:
    print('false')
    sys.exit(0)
e = json.load(open(path))
action = e.get('action')
if action == 'labeled' and e.get('label', {}).get('name') == 'enhancement':
    print('true')
else:
    labels = [l.get('name','') for l in e.get('issue', {}).get('labels', [])]
    print('true' if 'enhancement' in labels else 'false')
PY
)" >> $GITHUB_OUTPUT

      - name: Install Python dependencies
        if: steps.detect.outputs.is_enhancement == 'true'
        run: python -m pip install --upgrade pip && python -m pip install -r .github/assets/requirements.txt

      - name: Post to #feature-requests
        if: steps.detect.outputs.is_enhancement == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_FEATURE_REQUESTS_WEBHOOK }}
        run: |
          python .github/assets/discord_webhook_notify.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-type feature \
            --webhook "${{ secrets.DISCORD_FEATURE_REQUESTS_WEBHOOK }}"
