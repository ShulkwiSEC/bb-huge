name: Discord — Feature Requests

on:
  issues:
    types: [opened, closed, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'enhancement')
    steps:
      - name: Post to #feature-requests
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_FEATURE_REQUESTS_WEBHOOK }}
        run: |
          ACTION="${{ github.event.action }}"
          case "$ACTION" in
            opened)   COLOR=7419530   ;; # purple
            closed)   COLOR=5763719   ;; # green
            reopened) COLOR=16776960  ;; # yellow
            *)        COLOR=10197915  ;; # gray
          esac

          TITLE=$(echo '${{ github.event.issue.title }}' | head -c 256)
          BODY=$(echo '${{ github.event.issue.body }}' | head -c 1024)
          URL="${{ github.event.issue.html_url }}"
          USER="${{ github.event.issue.user.login }}"
          NUMBER="${{ github.event.issue.number }}"

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"💡 [#${NUMBER}] ${TITLE}\",
                \"description\": \"${BODY}\",
                \"url\": \"${URL}\",
                \"color\": ${COLOR},
                \"fields\": [
                  {\"name\": \"Status\",    \"value\": \"${ACTION}\",  \"inline\": true},
                  {\"name\": \"Opened by\", \"value\": \"${USER}\",   \"inline\": true}
                ],
                \"footer\": {\"text\": \"bb-huge / feature-request\"}
              }]
            }"
