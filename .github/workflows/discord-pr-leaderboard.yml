name: Discord — Pull Requests & Leaderboard

on:
  pull_request:
    types: [opened, closed]

jobs:
  notify:
    environment: 'bb-huge🤗 .env'
    if: |
      github.event.action == 'opened' ||
      (github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/assets/requirements.txt

      - name: Update leaderboard & notify Discord
        env:
          DISCORD_PR_LEADERBOARD_WEBHOOK: ${{ secrets.DISCORD_PR_LEADERBOARD_WEBHOOK }}
        run: |
          ACTION="${{ github.event.action }}"
          if [ "$ACTION" = "closed" ]; then
            EVENT_ACTION="merged"
          else
            EVENT_ACTION="opened"
          fi
          python .github/assets/pr_leaderboard.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-action "$EVENT_ACTION" \
            --webhook "$DISCORD_PR_LEADERBOARD_WEBHOOK"

      - name: Commit updated leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/assets/pr-leaderboard.json
          git diff --cached --quiet || git commit -m "chore: update contributor leaderboard"
          git push